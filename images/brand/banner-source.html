<!doctype html>
<html><head><meta charset="utf-8">
<!--
  HOUSELOOP LINKEDIN BANNER — the render source.

  ⭐ THE HIERARCHY IS THE WORDMARK, NOT THE TAGLINE (Zach, 2026-09-11): "the hero text the smart way
  home with the blue period UNDER a big HouseLoop wordmark that is black and blue, with the blue
  HouseLoop logo to the left." The first cut had this the other way round — a 52px lockup over a
  128px headline. The wordmark is the hero; the tagline sits under it.

  Every value is LIFTED from the live site, never drawn here:
    · the mark        components/ui/HouseLoopLogo.tsx   (chevron M4 16 L16 5 L28 16, circle 16/20/r6, stroke 2.5 round)
    · the wordmark    components/ui/HouseLoopWordmark.tsx ("House" bold + "Loop" normal weight)
    · --hl-navy       app/globals.css:12  #0A1128
    · --hl-brand      app/globals.css:25  #2D6DFF
    · the typeface    app/layout.tsx:19   DM Sans (next/font/google)

  Rendered through real Chrome so the WEBFONT is the site's actual DM Sans. rsvg-convert and
  ImageMagick were both available and both rejected: DM Sans is not installed as a system font on
  this machine, so either would have silently substituted a fallback face and shipped a wordmark
  that is not the brand's.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root { --hl-navy:#0A1128; --hl-brand:#2D6DFF; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#888; font-family:"DM Sans", ui-sans-serif, system-ui, sans-serif; }

  .banner { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .banner.white { background:#ffffff; }
  .banner.navy  { background:var(--hl-navy); }

  /* The one decoration: a soft brand-blue glow bled off the right edge, echoing the loop.
     No gradients across the type, no stock photography, no green. */
  .glow { position:absolute; border-radius:50%; pointer-events:none; }
  .white .glow { background:radial-gradient(circle, rgba(45,109,255,.14) 0%, rgba(45,109,255,0) 70%); }
  .navy  .glow { background:radial-gradient(circle, rgba(45,109,255,.38) 0%, rgba(45,109,255,0) 70%); }

  .stack { position:relative; display:flex; flex-direction:column; align-items:center; }

  /* THE LOCKUP — the hero. Mark to the LEFT of the letters, on one baseline. */
  .lockup { display:flex; align-items:center; }
  .wordmark { font-weight:700; letter-spacing:-0.03em; line-height:1; }
  .white .wordmark { color:var(--hl-navy); }
  .white .wordmark .loop { font-weight:400; color:var(--hl-brand); }
  .navy  .wordmark { color:#ffffff; }
  .navy  .wordmark .loop { font-weight:400; color:var(--hl-brand); }

  /* THE TAGLINE — under the wordmark, with the brand-blue period. */
  .tagline { font-weight:500; letter-spacing:-0.02em; line-height:1; white-space:nowrap; }
  .white .tagline { color:var(--hl-navy); }
  .navy  .tagline { color:#ffffff; }
  .tagline .dot { color:var(--hl-brand); font-weight:700; }
</style></head>
<body>

<!-- ══ 1584 × 396 — the LinkedIn profile banner (4:1). THE PRIMARY. ══ -->
<div class="banner white" id="profile-white" style="width:1584px;height:396px;">
  <div class="glow" style="width:900px;height:900px;right:-330px;top:-250px;"></div>
  <div class="stack" style="gap:26px;">
    <div class="lockup" style="gap:30px;">
      <svg width="132" height="132" viewBox="0 0 32 32" fill="none">
        <path d="M4 16 L16 5 L28 16" stroke="#2D6DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="20" r="6" stroke="#2D6DFF" stroke-width="2.5" fill="none"/>
      </svg>
      <span class="wordmark" style="font-size:122px;">House<span class="loop">Loop</span></span>
    </div>
    <div class="tagline" style="font-size:64px;">The Smart Way Home<span class="dot">.</span></div>
  </div>
</div>

<!-- ══ 1584 × 396 — navy ground, the dark alternate ══
     ⚠ "House" goes WHITE here because black on navy is invisible; "Loop" KEEPS its brand blue,
     which the site's own small-size lockup does not do. At 24px the site turns the whole thing
     white because blue on navy is too dim to read — at 122px the same blue carries easily, so the
     two-colour wordmark survives. The rule is about legibility at size, not about the colour. -->
<div class="banner navy" id="profile-navy" style="width:1584px;height:396px;">
  <div class="glow" style="width:900px;height:900px;right:-330px;top:-250px;"></div>
  <div class="stack" style="gap:26px;">
    <div class="lockup" style="gap:30px;">
      <svg width="132" height="132" viewBox="0 0 32 32" fill="none">
        <path d="M4 16 L16 5 L28 16" stroke="#2D6DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="20" r="6" stroke="#2D6DFF" stroke-width="2.5" fill="none"/>
      </svg>
      <span class="wordmark" style="font-size:122px;">House<span class="loop">Loop</span></span>
    </div>
    <div class="tagline" style="font-size:64px;">The Smart Way Home<span class="dot">.</span></div>
  </div>
</div>

<!-- ══ 1128 × 191 — the LinkedIn COMPANY PAGE cover (5.9:1) ══
     ⚠ A different layout, not the same one scaled. At 191px tall a stacked lockup-above-tagline
     leaves both halves tiny, and LinkedIn overlays the page's logo tile on the lower LEFT of this
     image — so the composition sits RIGHT of centre and the left third is deliberately empty. -->
<div class="banner white" id="company-white" style="width:1128px;height:191px;justify-content:flex-end;">
  <div class="glow" style="width:520px;height:520px;right:-190px;top:-165px;"></div>
  <div class="stack" style="gap:11px;align-items:flex-start;margin-right:64px;">
    <div class="lockup" style="gap:15px;">
      <svg width="62" height="62" viewBox="0 0 32 32" fill="none">
        <path d="M4 16 L16 5 L28 16" stroke="#2D6DFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="20" r="6" stroke="#2D6DFF" stroke-width="2.5" fill="none"/>
      </svg>
      <span class="wordmark" style="font-size:58px;">House<span class="loop">Loop</span></span>
    </div>
    <div class="tagline" style="font-size:30px;">The Smart Way Home<span class="dot">.</span></div>
  </div>
</div>

</body></html>
